<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="Product Review Form for WDD 131 course.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <!-- Product Selection -->
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset class="rating-fieldset">
                <legend>Overall Rating</legend>
                <div class="rating-container">
                    <div class="rating-option">
                        <span class="stars">☆</span>
                        <input type="radio" id="star1" name="rating" value="1" required>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆</span>
                        <input type="radio" id="star2" name="rating" value="2" required>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆</span>
                        <input type="radio" id="star3" name="rating" value="3" required>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆☆</span>
                        <input type="radio" id="star4" name="rating" value="4" required>
                    </div>
                    <div class="rating-option">
                        <span class="stars">☆☆☆☆☆</span>
                        <input type="radio" id="star5" name="rating" value="5" required>
                    </div>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- Useful Features -->
            <fieldset class="features-fieldset">
                <legend>Which features did you find useful in the product?<br><em>(Check all that apply)</em></legend>
                
                <label class="checkbox-label">
                    <input type="checkbox" id="durability" name="features" value="durability">
                    Durability
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="ease" name="features" value="ease-of-use">
                    Ease of Use
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="performance" name="features" value="performance">
                    Performance
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="design" name="features" value="design">
                    Design
                </label>
            </fieldset>

            <!-- Written Review -->
            <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="writtenReview" name="writtenReview" rows="6"></textarea>

            <!-- User Name -->
            <label for="userName">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="userName" name="userName">

            <!-- Submit Button -->
            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌺 Masango Dewheretsoko 🌺 Zimbabwe</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
